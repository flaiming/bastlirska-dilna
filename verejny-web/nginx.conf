# Bastlířská dílna – statický web (zdroj: repozitář bastlirska-dilna, složka site/)
server {
    server_name bastleni.oram.cz;

    root /www/bastleni;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|jpg|jpeg|png|svg)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bastleni.oram.cz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bastleni.oram.cz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = bastleni.oram.cz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name bastleni.oram.cz;
    return 404; # managed by Certbot


}